<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORTEX FIGHTERS: OVERDRIVE - Prototype</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Rajdhani', sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* --- INTERFAZ HUD ESTILO ANIME / FIGHTING GAME --- */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 36px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }

    .fighter-hud {
      width: 42%;
      display: flex;
      flex-direction: column;
    }

    .fighter-hud.right {
      align-items: flex-end;
    }

    .fighter-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(0, 255, 200, 0.7);
    }

    .fighter-hud.right .fighter-name {
      text-shadow: 0 0 10px rgba(255, 50, 90, 0.7);
    }

    .hp-bar-container {
      width: 100%;
      height: 28px;
      background: rgba(20, 20, 30, 0.8);
      border: 2px solid #333;
      transform: skewX(-20deg);
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      transition: width 0.15s ease-out;
    }

    .fighter-hud.right .hp-bar-fill {
      background: linear-gradient(90deg, #ff0844 0%, #ffb199 100%);
    }

    .tension-bar-container {
      width: 70%;
      height: 12px;
      background: rgba(10, 10, 15, 0.8);
      border: 1px solid #444;
      transform: skewX(-20deg);
      margin-top: 6px;
      overflow: hidden;
    }

    .tension-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f6d365 0%, #fda085 100%);
      box-shadow: 0 0 10px #ffc837;
      transition: width 0.1s linear;
    }

    .timer-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #f1f1f1;
      background: #111;
      border: 3px solid #ffcc00;
      padding: 6px 24px;
      border-radius: 4px;
      text-shadow: 0 0 12px #ffcc00;
      transform: skewX(-10deg);
    }

    /* --- INDICADOR DE FASE DE COMBATE --- */
    #phase-banner {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 6px;
      padding: 6px 20px;
      border-radius: 20px;
      background: rgba(0, 255, 200, 0.15);
      border: 1px solid #00ffc8;
      color: #00ffc8;
      text-shadow: 0 0 10px #00ffc8;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #phase-banner.arena-mode {
      background: rgba(255, 60, 0, 0.2);
      border-color: #ff3c00;
      color: #ff3c00;
      text-shadow: 0 0 15px #ff3c00;
      transform: translateX(-50%) scale(1.15);
    }

    /* --- CONTROLES Y TUTORIAL --- */
    .controls-overlay {
      background: rgba(8, 10, 16, 0.85);
      border-top: 2px solid #222;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .key {
      display: inline-block;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      margin: 0 3px;
      box-shadow: 0 2px 0 #000;
    }

    #combo-counter {
      position: absolute;
      left: 60px;
      top: 220px;
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 3px 3px 0 #000, 0 0 20px rgba(255, 204, 0, 0.8);
      opacity: 0;
      transition: opacity 0.2s, transform 0.1s;
      transform: scale(0.8);
    }

    #combo-counter.active {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <div class="top-bar">
      <!-- P1: KAIRO -->
      <div class="fighter-hud left">
        <div class="fighter-name">Kairo [Shoto]</div>
        <div class="hp-bar-container">
          <div id="p1-hp" class="hp-bar-fill"></div>
        </div>
        <div class="tension-bar-container">
          <div id="p1-tension" class="tension-bar-fill"></div>
        </div>
      </div>

      <div class="timer-badge">99</div>

      <!-- P2: VALK-09 -->
      <div class="fighter-hud right">
        <div class="fighter-name">Valk-09 [Rushdown]</div>
        <div class="hp-bar-container">
          <div id="p2-hp" class="hp-bar-fill"></div>
        </div>
        <div class="tension-bar-container">
          <div id="p2-tension" class="tension-bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="phase-banner">FASE: ASFALTO TÉCNICO 2.5D</div>
    <div id="combo-counter">2 HITS!</div>

    <div class="controls-overlay">
      <div>
        <span class="key">A</span><span class="key">D</span> Moverse / Espacio &nbsp;|&nbsp;
        <span class="key">W</span> Saltar / Vuelo &nbsp;|&nbsp;
        <span class="key">S</span> Bloqueo
      </div>
      <div>
        <span class="key">J</span> Golpe Ligero &nbsp;|&nbsp;
        <span class="key">K</span> <b>IMPACTO ORBITAL</b> (Lanza al 3D) &nbsp;|&nbsp;
        <span class="key">L</span> Ráfaga de Energía &nbsp;|&nbsp;
        <span class="key">ESPACIO</span> Alternar Cámara
      </div>
    </div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    /* =========================================================================
       VORTEX FIGHTERS: OVERDRIVE - CORE ENGINE (THREE.JS + ES6 FSM)
       ========================================================================= */

    // --- 1. CONFIGURACIÓN DEL ESCENARIO Y MOTOR GRÁFICO ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06080e);
    scene.fog = new THREE.FogExp2(0x06080e, 0.025);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- 2. ILUMINACIÓN CYBERPUNK ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const cyanLight = new THREE.PointLight(0x00f2fe, 3, 30);
    cyanLight.position.set(-8, 5, 5);
    scene.add(cyanLight);

    const magentaLight = new THREE.PointLight(0xff0844, 3, 30);
    magentaLight.position.set(8, 5, 5);
    scene.add(magentaLight);

    // --- 3. ARENA DE COMBATE (GRID TECH PISOS Y PILARES) ---
    const floorGeo = new THREE.PlaneGeometry(80, 80, 40, 40);
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x0a0c14,
      roughness: 0.3,
      metalness: 0.8,
      wireframe: false
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Grid holográfico superpuesto
    const gridHelper = new THREE.GridHelper(80, 40, 0x00ffc8, 0x1d2436);
    gridHelper.position.y = 0.02;
    scene.add(gridHelper);

    // Pilares de la arena exterior
    const pillarGeo = new THREE.BoxGeometry(2, 16, 2);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x151923, metalness: 0.5 });
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      pillar.position.set(Math.cos(angle) * 28, 8, Math.sin(angle) * 28);
      pillar.castShadow = true;
      scene.add(pillar);
    }

    // --- 4. SISTEMA DE PARTÍCULAS (IMPACTOS Y AURA) ---
    const particles = [];
    const particleGeo = new THREE.SphereGeometry(0.15, 8, 8);

    function spawnHitParticles(x, y, z, colorHex = 0xffcc00, count = 15) {
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(particleGeo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        particles.push({
          mesh,
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 0.6,
            Math.random() * 0.5 + 0.2,
            (Math.random() - 0.5) * 0.6
          ),
          life: 1.0
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= 0.03;
        p.mesh.position.add(p.vel);
        p.mesh.scale.setScalar(p.life);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    // --- 5. CLASE LUCHADOR (FIGHTER - MESH ESTILIZADO Y MÁQUINA DE ESTADOS) ---
    class Fighter {
      constructor(name, color, startX, isPlayer1 = true) {
        this.name = name;
        this.isPlayer1 = isPlayer1;
        this.hp = 100;
        this.tension = 0;
        this.state = 'IDLE'; // IDLE, WALK, ATTACK, LAUNCH_ATTACK, BLOCK, HIT, LAUNCHED
        this.combo = 0;

        this.pos = new THREE.Vector3(startX, 0, 0);
        this.vel = new THREE.Vector3(0, 0, 0);
        this.facingRight = isPlayer1;

        // Grupo principal
        this.group = new THREE.Group();
        this.group.position.copy(this.pos);
        scene.add(this.group);

        // Geometría estilizada del personaje (Torso + Cabeza + Hombros)
        const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.6 });
        const accentMat = new THREE.MeshBasicMaterial({ color: isPlayer1 ? 0x00f2fe : 0xff0844 });

        // Torso
        this.torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.8), bodyMat);
        this.torso.position.y = 2.2;
        this.torso.castShadow = true;
        this.group.add(this.torso);

        // Cabeza
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), bodyMat);
        this.head.position.y = 3.8;
        this.head.castShadow = true;
        this.group.add(this.head);

        // Visor holográfico
        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.85), accentMat);
        visor.position.y = 3.9;
        this.group.add(visor);

        // Brazo de ataque
        this.arm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.4, 0.45), bodyMat);
        this.arm.position.set(this.facingRight ? 0.8 : -0.8, 2.4, 0);
        this.group.add(this.arm);

        // Anillo de energía Aura
        const auraGeo = new THREE.TorusGeometry(1.2, 0.05, 8, 24);
        this.aura = new THREE.Mesh(auraGeo, accentMat);
        this.aura.rotation.x = Math.PI / 2;
        this.aura.position.y = 0.3;
        this.group.add(this.aura);
      }

      update(target) {
        // Gravedad y suelo
        this.pos.add(this.vel);
        if (this.pos.y > 0) {
          this.vel.y -= 0.025;
        } else {
          this.pos.y = 0;
          this.vel.y = 0;
          if (this.state === 'LAUNCHED') {
            this.state = 'IDLE';
          }
        }

        // Orientación hacia el enemigo en Modo 2.5D
        if (this.state !== 'LAUNCHED' && arenaPhase === 'TECH_2D') {
          this.facingRight = target.pos.x > this.pos.x;
          this.group.rotation.y = this.facingRight ? 0 : Math.PI;
        }

        // Límites de la arena
        this.pos.x = Math.max(-16, Math.min(16, this.pos.x));
        this.group.position.copy(this.pos);

        // Animación de respiración/Aura
        this.aura.rotation.z += 0.04;
        this.aura.position.y = 0.3 + Math.sin(Date.now() * 0.005) * 0.15;
      }

      attackLight(target) {
        if (this.state !== 'IDLE' && this.state !== 'WALK') return;
        this.state = 'ATTACK';
        this.arm.position.x = this.facingRight ? 1.6 : -1.6;
        this.arm.rotation.z = -Math.PI / 2;

        setTimeout(() => {
          this.checkHitbox(target, 8, false);
          this.resetArm();
        }, 150);
      }

      attackHeavyLauncher(target) {
        if (this.state !== 'IDLE' && this.state !== 'WALK') return;
        this.state = 'LAUNCH_ATTACK';
        this.arm.position.set(this.facingRight ? 1.8 : -1.8, 3.0, 0);
        this.arm.rotation.z = Math.PI / 4;

        setTimeout(() => {
          const hit = this.checkHitbox(target, 18, true);
          if (hit) {
            // ¡RUPTURA DE FASE AL GOLPEAR CON EL IMPACTO ORBITAL!
            triggerPhaseShift('ARENA_3D');
          }
          this.resetArm();
        }, 200);
      }

      resetArm() {
        setTimeout(() => {
          this.arm.position.set(this.facingRight ? 0.8 : -0.8, 2.4, 0);
          this.arm.rotation.z = 0;
          this.state = 'IDLE';
        }, 200);
      }

      checkHitbox(target, damage, isLauncher) {
        const dist = this.pos.distanceTo(target.pos);
        if (dist < 2.8 && target.state !== 'LAUNCHED') {
          target.takeDamage(damage, isLauncher, this.facingRight);
          this.tension = Math.min(100, this.tension + 15);
          updateHUD();
          return true;
        }
        return false;
      }

      takeDamage(damage, isLauncher, attackedFromRight) {
        if (this.state === 'BLOCK') {
          damage *= 0.2;
          spawnHitParticles(this.pos.x, 2.5, this.pos.z, 0x00f2fe, 5);
        } else {
          this.hp = Math.max(0, this.hp - damage);
          spawnHitParticles(this.pos.x, 2.5, this.pos.z, 0xffaa00, 20);
          
          if (isLauncher) {
            this.state = 'LAUNCHED';
            this.vel.y = 0.55; // Lanzamiento vertical hacia el cielo 3D
            this.vel.x = attackedFromRight ? 0.4 : -0.4;
            this.vel.z = -0.3;
          } else {
            this.state = 'HIT';
            this.pos.x += attackedFromRight ? 0.6 : -0.6;
            setTimeout(() => { if (this.state === 'HIT') this.state = 'IDLE'; }, 250);
          }
        }
        updateHUD();
      }
    }

    // Inicialización de Luchadores
    const p1 = new Fighter('KAIRO', 0x1d4ed8, -4, true);
    const p2 = new Fighter('VALK-09', 0xb91c1c, 4, false);

    // --- 6. SISTEMA DE CÁMARA "DUAL-SHIFT" (2.5D TÉCNICO -> 3D TENKAICHI) ---
    let arenaPhase = 'TECH_2D'; // 'TECH_2D' | 'ARENA_3D'
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const camTargetPos = new THREE.Vector3();
    const camLookAt = new THREE.Vector3();

    function updateCamera() {
      if (arenaPhase === 'TECH_2D') {
        // Cámara lateral de lucha callejera (Street Fighter Style)
        const midX = (p1.pos.x + p2.pos.x) * 0.5;
        const dist = Math.max(14, Math.abs(p1.pos.x - p2.pos.x) * 1.5);
        camTargetPos.set(midX, 5.5, dist);
        camLookAt.set(midX, 2.5, 0);
      } else {
        // Cámara orbital en tercera persona tras los hombros (Tenkaichi Style)
        const offset = p1.facingRight ? -7 : 7;
        camTargetPos.set(p1.pos.x + offset, p1.pos.y + 5, p1.pos.z + 9);
        camLookAt.copy(p2.pos).add(new THREE.Vector3(0, 2.5, 0));
      }

      // Interpolación suave slerp/lerp
      camera.position.lerp(camTargetPos, 0.08);
      const currentLook = new THREE.Vector3();
      camera.getWorldDirection(currentLook);
      const targetLook = camLookAt.clone().sub(camera.position).normalize();
      currentLook.lerp(targetLook, 0.1);
      camera.lookAt(camera.position.clone().add(currentLook));
    }

    function triggerPhaseShift(newPhase) {
      arenaPhase = newPhase;
      const banner = document.getElementById('phase-banner');
      if (newPhase === 'ARENA_3D') {
        banner.textContent = 'FASE: ASCENSIÓN ARENA 3D';
        banner.classList.add('arena-mode');
      } else {
        banner.textContent = 'FASE: ASFALTO TÉCNICO 2.5D';
        banner.classList.remove('arena-mode');
      }
    }

    // --- 7. INTERFAZ HUD DINÁMICA ---
    function updateHUD() {
      document.getElementById('p1-hp').style.width = p1.hp + '%';
      document.getElementById('p2-hp').style.width = p2.hp + '%';
      document.getElementById('p1-tension').style.width = p1.tension + '%';
      document.getElementById('p2-tension').style.width = p2.tension + '%';
    }

    // --- 8. CONTROLADOR DE ENTRADA (KEYBOARD INPUTS) ---
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'KeyJ') p1.attackLight(p2);
      if (e.code === 'KeyK') p1.attackHeavyLauncher(p2);
      if (e.code === 'Space') {
        // Alternar manual de fase de cámara para pruebas del prototipo
        triggerPhaseShift(arenaPhase === 'TECH_2D' ? 'ARENA_3D' : 'TECH_2D');
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'KeyS') p1.state = 'IDLE';
    });

    function processPlayerMovement() {
      if (p1.state === 'ATTACK' || p1.state === 'LAUNCH_ATTACK') return;

      const speed = arenaPhase === 'TECH_2D' ? 0.16 : 0.25;

      if (keys['KeyA']) {
        p1.pos.x -= speed;
        if (p1.state !== 'LAUNCHED') p1.state = 'WALK';
      }
      if (keys['KeyD']) {
        p1.pos.x += speed;
        if (p1.state !== 'LAUNCHED') p1.state = 'WALK';
      }
      if (keys['KeyW'] && p1.pos.y === 0) {
        p1.vel.y = arenaPhase === 'TECH_2D' ? 0.45 : 0.6;
      }
      if (keys['KeyS']) {
        p1.state = 'BLOCK';
      }

      // Movimiento de profundidad en Arena 3D
      if (arenaPhase === 'ARENA_3D') {
        if (keys['KeyQ']) p1.pos.z -= speed;
        if (keys['KeyE']) p1.pos.z += speed;
      }

      // IA básica responsiva del oponente para testear combates
      if (Math.random() < 0.03 && p2.pos.distanceTo(p1.pos) < 3.2) {
        Math.random() < 0.6 ? p2.attackLight(p1) : p2.attackHeavyLauncher(p1);
      } else if (p2.pos.distanceTo(p1.pos) > 2.2 && p2.state === 'IDLE') {
        p2.pos.x += p1.pos.x > p2.pos.x ? 0.06 : -0.06;
      }
    }

    // --- 9. BUCLE DE JUEGO PRINCIPAL (60 FPS) ---
    function animate() {
      requestAnimationFrame(animate);

      processPlayerMovement();
      p1.update(p2);
      p2.update(p1);
      updateParticles();
      updateCamera();

      renderer.render(scene, camera);
    }

    // Adaptabilidad a ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Iniciar
    updateHUD();
    animate();
  </script>
</body>
</html>
